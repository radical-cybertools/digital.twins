[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin"
version = "0.0.1"
description = "Experimental digital twin framework"
# FIXME(review): this floor is not real.  `streaming.py` uses
# `async with asyncio.timeout(...)`, which is 3.11+, so an actual 3.10
# interpreter fails at import of the first connect.  Either replace it with
# `asyncio.wait_for` (and audit `except TimeoutError`, which is only an alias
# of `asyncio.TimeoutError` from 3.11 on) or put the floor back to 3.11 and
# drop the `backports.strenum` dependency and the `py310` tox env with it.
requires-python = ">=3.10"
dependencies = [
    "radical.asyncflow>=0.5.0",
    "rhapsody-py>=0.4.0",
    "pyzmq>=25",
    "cloudpickle>=3",
    "backports.strenum>=1.3.1; python_version < '3.11'",
]

[project.optional-dependencies]
# the ORBIT service plugin (`digitaltwin.service`) and its client
service = [
    "radical.orbit>=0.7",
]
# ex-situ learning (`digitaltwin.learn`).  A separate extra rather than
# part of `service`: the learner runs perfectly well against a local
# engine with no ORBIT in sight, and a service host that only serves
# in-situ twins should not have to carry ROSE and its dependencies.
# NOTE: `StreamingActiveLearner` lives on ROSE PR #98 (commit 64330d9)
# and is not in any release yet -- install that branch until it merges.
learn = [
    "ROSE>=0.3",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

# discovered and imported by the ORBIT plugin host at startup; a broker or
# endpoint then hosts it with `--plugins default,dt`
[project.entry-points."radical.orbit.plugins"]
dt = "digitaltwin.service.plugin:PluginDT"

[tool.setuptools.packages.find]
where = ["src"]

# the dashboard: the Explorer reads `ui_module` off the installed package,
# and the plugin serves the rest from `{namespace}/ui`
[tool.setuptools.package-data]
"digitaltwin.service" = ["ui/*.html", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a live ORBIT broker and rhapsody endpoint",
]
