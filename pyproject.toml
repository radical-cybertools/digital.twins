[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin"
version = "0.1.0"
description = "Experimental digital twin framework"
# 3.11+: `async with asyncio.timeout(...)`, `enum.StrEnum`, and
# `TimeoutError` as the alias of `asyncio.TimeoutError`
requires-python = ">=3.11"
dependencies = [
    "radical.asyncflow>=0.5.0",
    "rhapsody-py>=0.4.0",
    "pyzmq>=25",
    "cloudpickle>=3",
]

[project.optional-dependencies]
# the ORBIT service plugin (`digitaltwin.service`) and its client
service = [
    "radical.orbit>=0.8",
    "rhapsody-py[telemetry]>=0.4.0",
]
# ex-situ learning (`digitaltwin.learn`).  A separate extra rather than
# part of `service`: the learner runs perfectly well against a local
# engine with no ORBIT in sight, and a service host that only serves
# in-situ twins should not have to carry ROSE and its dependencies.
# NOTE: the streaming capability (`rose.Stream`, ROSE PR #98) is not in
# any release yet -- install ROSE main until one ships.  The distribution
# is `rose-surrogate-explorer`: PyPI's `rose` is an unrelated project
# that installs over the `rose` package.
learn = [
    "rose-surrogate-explorer>=0.3",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

# discovered and imported by the ORBIT plugin host at startup; a broker or
# endpoint then hosts it with `--plugins default,dt`
[project.entry-points."radical.orbit.plugins"]
dt = "digitaltwin.service.plugin:PluginDT"

[tool.setuptools.packages.find]
where = ["src"]

# the dashboard: the Explorer reads `ui_module` off the installed package,
# and the plugin serves the rest from `{namespace}/ui`
[tool.setuptools.package-data]
"digitaltwin.service" = ["ui/*.html", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a live ORBIT broker and rhapsody endpoint",
]
