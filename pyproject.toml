[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin"
version = "0.1.0"
description = "Experimental digital twin framework"
# FIXME(review): this floor is not real.  `streaming.py` uses
# `async with asyncio.timeout(...)`, which is 3.11+, so an actual 3.10
# interpreter fails at import of the first connect.  Either replace it with
# `asyncio.wait_for` (and audit `except TimeoutError`, which is only an alias
# of `asyncio.TimeoutError` from 3.11 on) or put the floor back to 3.11 and
# drop the `backports.strenum` dependency and the `py310` tox env with it.
requires-python = ">=3.10"
dependencies = [
    "radical.asyncflow>=0.5.0",
    "rhapsody-py>=0.4.0",
    "pyzmq>=25",
    "cloudpickle>=3",
    "backports.strenum>=1.3.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
